name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --workspaces
      - run: npm run build --workspace=apt-hunter
      - run: npm run build --workspace=immoscout-mcp
      - run: npm test --workspace=apt-hunter
      - run: npm test --workspace=swipe-bot

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The VM's authorized_keys forces this key to run ~/deploy.sh regardless of what's requested
      # here (git fetch + reset --hard origin/main, npm install, rebuild all three workspaces,
      # restart the systemd service) — see ~/deploy.sh on swipe-bot-vm. The script line below is
      # never actually read by the server, but ssh-action requires one.
      - name: Deploy to swipe-bot-vm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: deploy
          timeout: 30s
          command_timeout: 5m
